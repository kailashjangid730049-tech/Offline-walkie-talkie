name: Build Android APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 18

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: 17

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Make Scripts Executable
        run: |
          chmod +x *.sh || true
          [ -d "scripts" ] && chmod +x scripts/* || true

      - name: Run Project Setup
        run: |
          if [ -f "./setup.sh" ]; then
            ./setup.sh
          fi

      - name: Run Build
        run: |
          ./build_apk.sh

      - name: Upload APK
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: WalkieTalkie-APK
          path: '**/*.apk'
