name: Build Android APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: 17

      - name: Make Scripts Executable
        run: |
          chmod +x *.sh

      - name: Run Build
        run: |
          ./build_apk.sh

      - name: Upload APK
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: WalkieTalkie-APK
          path: '**/*.apk'
